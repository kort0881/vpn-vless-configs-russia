name: FullAutomatedUpdate

on:
  schedule:
    - cron: '0 */2 * * *'   # раз в 2 часа
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-update
  cancel-in-progress: true

jobs:
  full-update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset to origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyyaml maxminddb geoip2
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download geoip.dat from ru-routing-dat
        run: |
          mkdir -p data
          wget -q -O data/geoip.dat https://cdn.jsdelivr.net/gh/GrimbirdUsers/ru-routing-dat@main/geoip.dat

      - name: Merge sources from proxy-collect manifest
        run: python scripts/proxy_collect_merge.py

      - name: Update githubmirror (mirror.py)
        run: python scripts/mirror.py

      - name: Generate my own VLESS configs
        run: python scripts/my_vless_generator.py

      - name: Run checker (main.py)
        run: python scripts/main.py --geoip data/geoip.dat

      - name: Commit and push all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          # Явно исключаем большой файл из индекса
          git reset data/githubmirror/new/all_new.txt 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита"
            exit 0
          fi
          
          git commit -m "🤖 Full auto-update $(date -u '+%Y-%m-%d %H:%M:%S')"
          
          # Вместо pull --rebase используем force-with-lease, т.к. локальная ветка всегда синхронизирована
          git push --force-with-lease origin main
