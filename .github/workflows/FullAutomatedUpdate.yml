name: FullAutomatedUpdate

on:
  schedule:
    - cron: '0 */2 * * *'   # раз в 2 часа
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-update
  cancel-in-progress: true

jobs:
  full-update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset to origin/main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyyaml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Шаг 2: Сбор источников (proxy-collect)
      - name: 2. Merge sources from proxy-collect manifest
        run: python scripts/proxy_collect_merge.py

      # Перенос сгенерированного config_sources.json в нужную для mirror.py директорию
      - name: Copy config_sources.json to data/
        run: |
          mkdir -p data
          cp scripts/data/config_sources.json data/config_sources.json

      # Шаг 1: mirror.py (теперь видит актуальный config_sources.json)
      - name: 1. Update githubmirror (mirror.py)
        run: python scripts/mirror.py

      # Шаг 3: Генерация своих конфигов (требует данных от mirror.py)
      - name: 3. Generate my own VLESS configs
        run: python scripts/my_vless_generator.py

      # Шаг 4: Основной checker
      - name: 4. Run checker (main.py)
        run: python scripts/main.py

      # Дополнительные скрипты mermeroo (если нужны)
      - name: 5. Parse mermeroo sources
        run: python scripts/parse_mermeroo.py

      - name: 6. Compare mermeroo with mirror
        run: python utils/compare_mermeroo_mirror.py

      - name: 7. Merge mermeroo to config_sources.json
        run: python scripts/merge_mermeroo_to_config_sources.py

      - name: 8. Convert extra mermeroo sources
        run: python scripts/convert_extra_sources.py

      - name: Commit and push all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Нет изменений для коммита"
            exit 0
          fi
          git commit -m "🤖 Full auto-update $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push origin main
